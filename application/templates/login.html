<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — Pelico</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="setup-wrap">
  <div class="setup-inner">

    <div class="setup-brand">
      <div class="setup-logo">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 10V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l2-1.14"/>
          <path d="M16.5 9.4 7.55 4.24"/>
          <polyline points="3.29 7 12 12 20.71 7"/>
          <line x1="12" x2="12" y1="22" y2="12"/>
        </svg>
        Pelico
      </div>
      <p>{{ site_name }}</p>
    </div>

    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <form method="post" action="/login">
      <div class="card">
        <div class="card-header">
          <div>
            <h2>Sign In</h2>
          </div>
        </div>
        <div class="card-body">
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username"
                   value="{{ username|default('') }}"
                   required autocomplete="username" autofocus>
          </div>
          <div class="form-group" style="margin-bottom:0">
            <label for="password">Password</label>
            <input type="password" id="password" name="password"
                   required autocomplete="current-password">
          </div>
        </div>
        <div class="card-footer">
          <button type="submit" class="btn btn-primary btn-lg btn-full">Sign In</button>
        </div>
      </div>
    </form>

    <p style="text-align:center; margin-top:1.25rem; font-size:.75rem; color:var(--text-muted)">
      Pelico &mdash; Self-hosted Inventory Appliance
    </p>
  </div>
</div>
</body>
</html>
