{{- if .Values.postgresql.enabled }}
---
# PVC for PostgreSQL data
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "pelico.fullname" . }}-postgresql
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pelico.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.postgresql.primary.persistence.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pelico.postgresHost" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pelico.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "pelico.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgresql
  # Recreate ensures the PVC is released before the new pod mounts it
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "pelico.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgresql
    spec:
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: postgresql
          image: "{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}"
          imagePullPolicy: {{ .Values.postgresql.image.pullPolicy }}
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "pelico.fullname" . }}-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "pelico.fullname" . }}-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: {{ include "pelico.fullname" . }}-config
                  key: POSTGRES_DB
            # Store data in a subdirectory so the volume root is never
            # treated as an existing cluster when the PVC is reused.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U $POSTGRES_USER
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            {{- toYaml .Values.postgresql.primary.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "pelico.fullname" . }}-postgresql
---
# ClusterIP service — name matches the host returned by pelico.postgresHost helper
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pelico.postgresHost" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pelico.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: postgres
      protocol: TCP
      name: postgres
  selector:
    {{- include "pelico.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
{{- end }}
