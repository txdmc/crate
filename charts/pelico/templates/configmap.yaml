apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pelico.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pelico.labels" . | nindent 4 }}
data:
  LOG_LEVEL: {{ .Values.app.logLevel | quote }}
  SETUP_REQUIRED: {{ .Values.app.setupRequired | toString | quote }}
  POSTGRES_HOST: {{ include "pelico.postgresHost" . | quote }}
  POSTGRES_DB: {{ .Values.postgresql.auth.database | default "pelico" | quote }}
  MINIO_ENDPOINT: {{ include "pelico.minioEndpoint" . | quote }}
