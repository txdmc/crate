name: Version Bump

# Runs whenever a PR is merged into main.
# Inspects the commits in the PR for Conventional Commit prefixes to decide
# the semver bump type:
#   - Any commit with "BREAKING CHANGE" in the footer or "!" after the type → major
#   - Any "feat:" commit → minor
#   - Everything else (fix:, chore:, docs:, refactor:, …) → patch
#
# After bumping, commits the new VERSION to main then:
#   - Always dispatches build-app.yml (container image — fast, frequent)
#   - Dispatches build-appliance.yml ONLY when packer/charts/scripts changed
#     (VM appliance build — slow, should be rare)
#
# NOTE: If main has branch protection rules that require PRs, grant
# "Allow GitHub Actions to bypass branch protection" in Settings →
# Branches, or store a fine-grained PAT as RELEASE_TOKEN and swap
# secrets.GITHUB_TOKEN → secrets.RELEASE_TOKEN in the checkout and
# push steps.

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  bump-version:
    name: Bump version and trigger build
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # push VERSION commit to main
      actions: write    # dispatch workflows

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # ── Determine bump type from conventional commits ────────────────────────
      - name: Determine bump type from commits
        id: bump
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          COMMITS=$(git log --format="%s%n%b" "${BASE_SHA}..${HEAD_SHA}")
          echo "--- Commits in PR ---"
          echo "$COMMITS"
          echo "---------------------"

          if echo "$COMMITS" | grep -qE '^BREAKING CHANGE:|^[a-z]+(\(.+\))?!:'; then
            echo "type=major" >> "$GITHUB_OUTPUT"
          elif echo "$COMMITS" | grep -qE '^feat(\(.+\))?:'; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
          else
            echo "type=patch" >> "$GITHUB_OUTPUT"
          fi

      # ── Detect whether appliance definition changed ──────────────────────────
      - name: Check if appliance rebuild needed
        id: appliance
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          CHANGED=$(git diff --name-only "${BASE_SHA}..${HEAD_SHA}")
          echo "--- Changed files ---"
          echo "$CHANGED"
          echo "---------------------"
          if echo "$CHANGED" | grep -qE '^packer/|^charts/'; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "Appliance rebuild: YES (packer/ or charts/ changed)"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Appliance rebuild: NO (only application/ or other files changed)"
          fi

      # ── Compute new version ──────────────────────────────────────────────────
      - name: Bump VERSION file
        id: version
        run: |
          CURRENT=$(cat VERSION | tr -d '[:space:]')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "${{ steps.bump.outputs.type }}" in
            major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR+1)); PATCH=0 ;;
            *)     PATCH=$((PATCH+1)) ;;
          esac
          NEW="${MAJOR}.${MINOR}.${PATCH}"
          echo "$NEW" > VERSION
          echo "Bumped ${CURRENT} → ${NEW} (${{ steps.bump.outputs.type }})"
          echo "version=v${NEW}" >> "$GITHUB_OUTPUT"
          echo "plain=${NEW}" >> "$GITHUB_OUTPUT"

      # ── Sync Chart.yaml version + appVersion ────────────────────────────────
      - name: Update Chart.yaml
        run: |
          NEW="${{ steps.version.outputs.plain }}"
          sed -i "s/^version: .*/version: ${NEW}/" charts/crate/Chart.yaml
          sed -i "s/^appVersion: .*/appVersion: \"${NEW}\"/" charts/crate/Chart.yaml

      # ── Commit new VERSION to main ───────────────────────────────────────────
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION charts/crate/Chart.yaml
          git commit -m "chore: bump version to ${{ steps.version.outputs.version }} [skip ci]"
          git push origin main

      # ── Always build the app container image ─────────────────────────────────
      - name: Dispatch build-app workflow
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build-app.yml',
              ref: 'main',
            });
            console.log('Dispatched build-app.yml for ${{ steps.version.outputs.version }}');

      # ── Only rebuild the appliance when infra files changed ──────────────────
      - name: Dispatch build-appliance workflow
        if: steps.appliance.outputs.needed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build-appliance.yml',
              ref: 'main',
              inputs: { version: '${{ steps.version.outputs.version }}' }
            });
            console.log('Dispatched build-appliance.yml for ${{ steps.version.outputs.version }}');

