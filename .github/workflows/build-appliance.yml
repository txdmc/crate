name: Build Appliance Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v0.1.0)"
        required: true
        default: "v0.0.0-dev"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

###############################################################################
# Job 1 — Build and push the application container image to ghcr.io
###############################################################################
jobs:
  build-app-image:
    name: Build app container image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    outputs:
      version: ${{ steps.version.outputs.version }}
      image_ref: ${{ steps.version.outputs.image_ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VER="${{ inputs.version }}"
          else
            VER="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VER}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: application/
          push: true
          tags: |
            ${{ steps.version.outputs.image_ref }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.title=Crate
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

###############################################################################
# Job 2 — Build the VM appliance images (QCOW2 → OVA, VHDX, QCOW2)
###############################################################################
  build-appliance:
    name: Build VM appliance
    needs: build-app-image
    runs-on: [self-hosted, Linux, X64, crate]
    permissions:
      contents: write   # needed to create/update GitHub Releases
      packages: read

    env:
      VERSION: ${{ needs.build-app-image.outputs.version }}
      APP_IMAGE: ${{ needs.build-app-image.outputs.image_ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── KVM access ───────────────────────────────────────────────────────────
      - name: Check KVM access
        run: |
          if [[ ! -e /dev/kvm ]]; then
            echo "::error::/dev/kvm not available. Ensure the runner pod has the KVM device mounted."
            exit 1
          fi
          ls -la /dev/kvm
          echo "KVM available"

      # ── System packages ──────────────────────────────────────────────────────
      - name: Install QEMU and utilities
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 \
            qemu-utils \
            ovmf \
            xz-utils

      # ── ISO caching ──────────────────────────────────────────────────────────
      # The runner pod has a PVC mounted at /runner-state — use it directly
      # so the ISO survives across runs without uploading to GitHub's cache.
      - name: Ensure Ubuntu 24.04 ISO is cached on PVC
        id: iso
        run: |
          ISO_DIR="/runner-state/cache"
          ISO_PATH="${ISO_DIR}/ubuntu-24.04.iso"
          SUMS_PATH="${ISO_DIR}/ubuntu-24.04.SHA256SUMS"
          mkdir -p "${ISO_DIR}"

          # Always refresh the SHA256SUMS file so we notice if Ubuntu re-cuts the ISO
          curl -fsSL -o "${SUMS_PATH}" \
            "https://releases.ubuntu.com/24.04.2/SHA256SUMS"

          EXPECTED=$(grep "ubuntu-24.04.2-live-server-amd64.iso" "${SUMS_PATH}" | awk '{print $1}')

          # Only download the ISO if it's missing or the checksum no longer matches
          if [[ -f "${ISO_PATH}" ]] && echo "${EXPECTED}  ${ISO_PATH}" | sha256sum -c - &>/dev/null; then
            echo "ISO cache hit — skipping download ($(du -sh "${ISO_PATH}" | cut -f1))"
          else
            echo "ISO not cached or checksum mismatch — downloading…"
            curl -fsSL -o "${ISO_PATH}" \
              "https://releases.ubuntu.com/24.04.2/ubuntu-24.04.2-live-server-amd64.iso"
            echo "${EXPECTED}  ${ISO_PATH}" | sha256sum -c -
          fi

          echo "checksum=sha256:${EXPECTED}" >> "$GITHUB_OUTPUT"

      # ── Packer ───────────────────────────────────────────────────────────────
      - name: Set up Packer
        uses: hashicorp/setup-packer@main
        with:
          version: "1.11.0"

      - name: Packer init
        run: packer init packer/

      - name: Build QEMU image
        env:
          PKR_VAR_ubuntu_iso_url: "file:///runner-state/cache/ubuntu-24.04.iso"
          PKR_VAR_ubuntu_iso_checksum: "${{ steps.iso.outputs.checksum }}"
          PKR_VAR_appliance_version: "${{ env.VERSION }}"
          PKR_VAR_app_image: "${{ env.APP_IMAGE }}"
          PKR_VAR_app_version: "${{ env.VERSION }}"
          PKR_VAR_memory: "4096"
          PACKER_LOG: "1"
        run: |
          packer build \
            -only="crate-appliance.qemu.crate_qemu" \
            packer/

      # ── Format conversions ───────────────────────────────────────────────────
      - name: Convert QCOW2 → OVA (VirtualBox / VMware)
        run: |
          QCOW2="packer/output/qemu/crate-${VERSION}.qcow2"
          bash packer/scripts/create-ova.sh \
            "$QCOW2" \
            "crate-${VERSION}.ova" \
            "${VERSION}"

      - name: Convert QCOW2 → VHDX (Hyper-V)
        run: |
          QCOW2="packer/output/qemu/crate-${VERSION}.qcow2"
          qemu-img convert -p -O vhdx "$QCOW2" "crate-${VERSION}.vhdx"

      - name: Copy QCOW2 (KVM / Proxmox / Xen)
        run: |
          cp "packer/output/qemu/crate-${VERSION}.qcow2" "crate-${VERSION}.qcow2"

      # ── Compress all artifacts ───────────────────────────────────────────────
      - name: Compress with xz
        run: |
          # -T0 = all CPU threads, --best for maximum compression on large files
          # -6 is a good balance of ratio vs CPU/memory; --best would OOM the runner pod
          xz -T0 -6 --verbose "crate-${VERSION}.ova"
          xz -T0 -6 --verbose "crate-${VERSION}.vhdx"
          xz -T0 -6 --verbose "crate-${VERSION}.qcow2"

      # ── Checksums ────────────────────────────────────────────────────────────
      - name: Generate SHA256 checksums
        run: sha256sum crate-"${VERSION}".*.xz > SHA256SUMS

      # ── GitHub Release ───────────────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Crate ${{ env.VERSION }}"
          tag_name: "${{ env.VERSION }}"
          draft: false
          prerelease: ${{ contains(env.VERSION, '-') }}
          generate_release_notes: true
          body: |
            ## Crate ${{ env.VERSION }}

            Self-hosted inventory tracking appliance. Boot in a VM,
            navigate to `http://crate.local`, complete the setup wizard.

            ### Downloads

            | Format | For | File |
            |--------|-----|------|
            | OVA    | VirtualBox, VMware ESXi / Workstation | `crate-${{ env.VERSION }}.ova.xz` |
            | VHDX   | Hyper-V | `crate-${{ env.VERSION }}.vhdx.xz` |
            | QCOW2  | KVM, Proxmox, Xen, XCP-ng | `crate-${{ env.VERSION }}.qcow2.xz` |

            ### Quick Start
            1. Download and decompress: `xz -d crate-${{ env.VERSION }}.<format>.xz`
            2. Create a VM (2 vCPU, 2 GB RAM, 40 GB disk) and attach the image
            3. Boot the VM — first-run setup takes ~3 minutes
            4. Navigate to **http://crate.local** (or the VM's IP) on your LAN
            5. Complete the setup wizard

            Verify your download with `SHA256SUMS`.

          files: |
            crate-${{ env.VERSION }}.ova.xz
            crate-${{ env.VERSION }}.vhdx.xz
            crate-${{ env.VERSION }}.qcow2.xz
            SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
