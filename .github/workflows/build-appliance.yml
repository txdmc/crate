name: Build Appliance Image

# Runs ONLY on manual dispatch or when the appliance definition changes.
# The app container is NOT baked in — it is pulled fresh on customer first boot.
# Trigger this manually when you want to cut a new appliance release (new OS,
# new k3s version, new infra images, chart structure changes, etc.)
on:
  push:
    branches:
      - main
    paths:
      - "packer/**"
      - "charts/**"
      - ".github/workflows/build-appliance.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v0.1.0) — defaults to VERSION file"
        required: false
        default: ""

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

###############################################################################
# Build the VM appliance images (QCOW2 → OVA, VHDX, QCOW2)
###############################################################################
jobs:
  build-appliance:
    name: Build VM appliance
    runs-on: [self-hosted, Linux, X64, crate]
    permissions:
      contents: write   # needed to create/update GitHub Releases
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            VER="${{ inputs.version }}"
          else
            VER="v$(cat VERSION | tr -d '[:space:]')"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

      # ── KVM access ───────────────────────────────────────────────────────────
      - name: Check KVM access
        run: |
          if [[ ! -e /dev/kvm ]]; then
            echo "::error::/dev/kvm not available. Ensure the runner pod has the KVM device mounted."
            exit 1
          fi
          ls -la /dev/kvm
          echo "KVM available"

      # ── System packages ──────────────────────────────────────────────────────
      - name: Install QEMU and utilities
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 \
            qemu-utils \
            ovmf \
            xz-utils

      # ── ISO caching ──────────────────────────────────────────────────────────
      # The runner pod has a PVC mounted at /runner-state — use it directly
      # so the ISO survives across runs without uploading to GitHub's cache.
      - name: Ensure Ubuntu 24.04 ISO is cached on PVC
        id: iso
        run: |
          ISO_DIR="/runner-state/cache"
          ISO_PATH="${ISO_DIR}/ubuntu-24.04.iso"
          SUMS_PATH="${ISO_DIR}/ubuntu-24.04.SHA256SUMS"
          mkdir -p "${ISO_DIR}"

          # Always refresh the SHA256SUMS file so we notice if Ubuntu re-cuts the ISO
          curl -fsSL -o "${SUMS_PATH}" \
            "https://releases.ubuntu.com/24.04.2/SHA256SUMS"

          EXPECTED=$(grep "ubuntu-24.04.2-live-server-amd64.iso" "${SUMS_PATH}" | awk '{print $1}')

          # Only download the ISO if it's missing or the checksum no longer matches
          if [[ -f "${ISO_PATH}" ]] && echo "${EXPECTED}  ${ISO_PATH}" | sha256sum -c - &>/dev/null; then
            echo "ISO cache hit — skipping download ($(du -sh "${ISO_PATH}" | cut -f1))"
          else
            echo "ISO not cached or checksum mismatch — downloading…"
            curl -fsSL -o "${ISO_PATH}" \
              "https://releases.ubuntu.com/24.04.2/ubuntu-24.04.2-live-server-amd64.iso"
            echo "${EXPECTED}  ${ISO_PATH}" | sha256sum -c -
          fi

          echo "checksum=sha256:${EXPECTED}" >> "$GITHUB_OUTPUT"

      # ── Packer ───────────────────────────────────────────────────────────────
      - name: Set up Packer
        uses: hashicorp/setup-packer@main
        with:
          version: "1.11.0"

      - name: Packer init
        run: packer init packer/

      - name: Build QEMU image
        env:
          PKR_VAR_ubuntu_iso_url: "file:///runner-state/cache/ubuntu-24.04.iso"
          PKR_VAR_ubuntu_iso_checksum: "${{ steps.iso.outputs.checksum }}"
          PKR_VAR_appliance_version: "${{ steps.version.outputs.version }}"
          PKR_VAR_memory: "4096"
          PACKER_LOG: "1"
        run: |
          packer build \
            -only="crate-appliance.qemu.crate_qemu" \
            packer/

      # ── Format conversions ───────────────────────────────────────────────────
      - name: Convert QCOW2 → OVA (VirtualBox / VMware)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          QCOW2="packer/output/qemu/crate-${VERSION}.qcow2"
          bash packer/scripts/create-ova.sh \
            "$QCOW2" \
            "crate-${VERSION}.ova" \
            "${VERSION}"

      - name: Convert QCOW2 → VHDX (Hyper-V)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          QCOW2="packer/output/qemu/crate-${VERSION}.qcow2"
          qemu-img convert -p -O vhdx "$QCOW2" "crate-${VERSION}.vhdx"

      - name: Copy QCOW2 (KVM / Proxmox / Xen)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cp "packer/output/qemu/crate-${VERSION}.qcow2" "crate-${VERSION}.qcow2"

      # ── Compress all artifacts ───────────────────────────────────────────────
      - name: Compress with xz
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          xz -T0 -6 --verbose "crate-${VERSION}.ova"
          xz -T0 -6 --verbose "crate-${VERSION}.vhdx"
          xz -T0 -6 --verbose "crate-${VERSION}.qcow2"

      # ── Checksums ────────────────────────────────────────────────────────────
      - name: Generate SHA256 checksums
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: sha256sum crate-"${VERSION}".*.xz > SHA256SUMS

      # ── GitHub Release ───────────────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Crate ${{ steps.version.outputs.version }}"
          tag_name: "${{ steps.version.outputs.version }}"
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          generate_release_notes: true
          body: |
            ## Crate ${{ steps.version.outputs.version }}

            Self-hosted inventory tracking appliance. Boot in a VM and
            navigate to `http://crate` or `http://crate.local` to get started.

            ### Downloads

            | Format | For | File |
            |--------|-----|------|
            | OVA    | VirtualBox, VMware ESXi / Workstation | `crate-${{ steps.version.outputs.version }}.ova.xz` |
            | VHDX   | Hyper-V | `crate-${{ steps.version.outputs.version }}.vhdx.xz` |
            | QCOW2  | KVM, Proxmox, Xen, XCP-ng | `crate-${{ steps.version.outputs.version }}.qcow2.xz` |

            ### Quick Start
            1. Download and decompress: `xz -d crate-${{ steps.version.outputs.version }}.<format>.xz`
            2. Create a VM (2 vCPU, 2 GB RAM minimum) and attach the image
            3. Boot — first-run setup takes ~3 minutes (pulls the app image)
            4. Navigate to **http://crate** or **http://crate.local** on your LAN
            5. Complete the setup wizard

            Verify your download with `SHA256SUMS`.

          files: |
            crate-${{ steps.version.outputs.version }}.ova.xz
            crate-${{ steps.version.outputs.version }}.vhdx.xz
            crate-${{ steps.version.outputs.version }}.qcow2.xz
            SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
